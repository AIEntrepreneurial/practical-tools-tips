title: AI创业指南与资源分享
description: 探索人工智能时代的创业机遇与挑战
author: AI Entrepreneur
email: ai-entrepreneur@example.com

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Custom variables
version: 1.1.0

# SEO settings
twitter:
  username: your_twitter_username
  card: summary_large_image
social:
  name: AI创业指南与资源分享
  links:
    - https://github.com/your-username

# Google Analytics (optional)
google_analytics: UA-XXXXXXXXX-X

# Exclude settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - "*.log"
  - ".gitignore"