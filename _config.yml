title: 实用工具与技巧分享
description: 发现并分享有价值的工具和技巧
author: Web Admin
email: contact@example.com

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Custom variables
version: 1.1.0

# SEO settings
twitter:
  username: your_twitter_username
  card: summary_large_image
social:
  name: 实用工具与技巧分享
  links:
    - https://github.com/your-username

# Google Analytics (optional)
google_analytics: UA-XXXXXXXXX-X

# Exclude settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - "*.log"
  - ".gitignore"